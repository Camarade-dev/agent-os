[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.1.0"
description = "Admissible local developer tool for governed coding-agent execution and evidence-backed acceptance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
agent-os = "agent_os.cli:main"
admissible = "admissible.product_launcher.__main__:main"
admissible-historical-pairing-tag = "admissible.operator_tools.historical_pairing_tag:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_os*", "admissible*"]

[tool.setuptools.package-data]
agent_os = ["templates/*.md"]
"admissible.product_ui" = ["index.html", "app.css", "app.js"]

[tool.pytest.ini_options]
markers = [
    "browser_runtime: opt-in test requiring an already-installed allowlisted Chromium-family browser (RUN_043); skips honestly when unavailable.",
]
