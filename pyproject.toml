[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.1.0"
description = "Admissible local developer tool for governed coding-agent execution and evidence-backed acceptance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
agent-os = "agent_os.cli:main"
admissible = "admissible.product_launcher.__main__:main"
admissible-historical-pairing-tag = "admissible.operator_tools.historical_pairing_tag:main"
admissible-historical-pairing-v4-extract = "admissible.operator_tools.historical_pairing_v4_extract:main"
admissible-codex-namespace-bootstrap = "admissible.capsule.boundary_launcher:namespace_bootstrap_main"
admissible-owner-authority-installer = "admissible.capsule.owner_authority.installer:main"
admissible-owner-authority-provisioner = "admissible.capsule.owner_authority.provisioner:main"
admissible-owner-authority-broker = "admissible.capsule.owner_authority.broker_service:main"
admissible-owner-authority-crypto-revision = "admissible.capsule.owner_authority.crypto_revision:main"
admissible-owner-authority-host-readiness = "admissible.capsule.owner_authority.host_readiness:main"
admissible-owner-authority-deployment-artifact = "admissible.capsule.owner_authority.deployment_artifact:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_os*", "admissible*"]

[tool.setuptools.package-data]
agent_os = ["templates/*.md"]
"admissible.product_ui" = ["index.html", "app.css", "app.js"]
"admissible.capsule" = [
    "protocol_schemas/README.md",
    "protocol_schemas/*.json",
    "protocol_schemas/v1/*.json",
    "protocol_schemas/v2/*.json",
    "broker_schemas/*.json",
    "destination_manifests/*.json",
]

[tool.setuptools.data-files]
"share/doc/agent-os" = [
    "docs/admissible-host-codex-capsule-backend.md",
    "docs/admissible-codex-os-boundary.md",
    "docs/admissible-codex-model-authority.md",
    "docs/admissible-owner-rooted-witness-trust.md",
    "docs/admissible-external-owner-authority.md",
    "docs/admissible-owner-authority-installation-plan.md",
]

[tool.pytest.ini_options]
markers = [
    "browser_runtime: opt-in test requiring an already-installed allowlisted Chromium-family browser (RUN_043); skips honestly when unavailable.",
]
