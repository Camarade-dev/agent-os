<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Form State Fixture</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Form State Fixture</h1>
  <form id="demo-form">
    <label for="name">Name (min 3 chars)</label>
    <input id="name" name="name" type="text" autocomplete="off">
    <div id="validation-message">Enter at least 3 characters.</div>
    <button id="submit" type="submit">Submit</button>
  </form>
  <div id="submitted-banner" hidden>Submitted locally.</div>
  <script src="app.js"></script>
</body>
</html>
