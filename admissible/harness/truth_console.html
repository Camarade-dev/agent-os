<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  :root {
    --tc-bg: #ffffff;
    --tc-text: #111827;
    --tc-muted: #374151;
    --tc-border: #9ca3af;
    --tc-card-bg: #f9fafb;
    --tc-tab-inactive-bg: #e5e7eb;
    --tc-tab-inactive-text: #1f2937;
    --tc-tab-active-bg: #1d4ed8;
    --tc-tab-active-text: #ffffff;
    --tc-pre-bg: #111827;
    --tc-pre-text: #f3f4f6;
    --tc-warning-bg: #fef3c7;
    --tc-warning-text: #78350f;
    --tc-warning-border: #d97706;
    --tc-info-bg: #dbeafe;
    --tc-info-text: #1e3a8a;
    --tc-info-border: #2563eb;
  }
  body.truth-console-v0.high-contrast-light {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    margin: 0;
    padding: 2rem;
    line-height: 1.5;
    max-width: 1200px;
    margin-inline: auto;
    background: var(--tc-bg);
    color: var(--tc-text);
  }
  h1, h2, h3, h4 {
    line-height: 1.25;
    color: var(--tc-text);
  }
  code, pre {
    font-family: "SFMono-Regular", Consolas, monospace;
  }
  .claim-boundary {
    background: var(--tc-warning-bg);
    color: var(--tc-warning-text);
    border: 2px solid var(--tc-warning-border);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    margin: 1rem 0;
  }
  .execution-banner {
    background: var(--tc-info-bg);
    color: var(--tc-info-text);
    border: 2px solid var(--tc-info-border);
    border-radius: 6px;
    padding: 0.75rem 1rem;
    margin: 1rem 0;
    font-weight: bold;
  }
  .truth-boundary {
    background: var(--tc-card-bg);
    color: var(--tc-text);
    border-left: 4px solid var(--tc-border);
    padding: 0.75rem 1rem;
    margin: 1rem 0;
  }
  .prompt-panel {
    background: #eff6ff;
    color: var(--tc-text);
    border: 1px solid #93c5fd;
    border-radius: 6px;
    padding: 1rem;
    margin: 1rem 0;
  }
  .prompt-panel blockquote {
    margin: 0.5rem 0 0;
    font-style: italic;
    color: var(--tc-muted);
  }
  .header-grid, .meta-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 0.25rem 1rem;
    color: var(--tc-text);
  }
  .header-grid dt, .meta-grid dt {
    color: var(--tc-muted);
    font-weight: 600;
  }
  .timeline-wrapper {
    overflow-x: auto;
    margin: 1rem 0;
    border: 1px solid var(--tc-border);
    border-radius: 6px;
  }
  table.timeline {
    width: 100%;
    min-width: 720px;
    border-collapse: collapse;
    margin: 0;
    background: var(--tc-bg);
    color: var(--tc-text);
  }
  table.timeline th, table.timeline td {
    border: 1px solid var(--tc-border);
    padding: 0.5rem 0.75rem;
    text-align: left;
    vertical-align: top;
  }
  table.timeline th {
    background: var(--tc-card-bg);
    color: var(--tc-text);
    font-weight: 700;
  }
  table.timeline tbody tr:nth-child(even) {
    background: #f3f4f6;
  }
  .decision-REQUIRE_HUMAN_APPROVAL { color: #b45309; font-weight: bold; }
  .decision-ALLOW_WITH_LIMITS { color: #1d4ed8; font-weight: bold; }
  .decision-REFUSE { color: #b91c1c; font-weight: bold; }
  .decision-REQUEST_MORE_EVIDENCE { color: #6d28d9; font-weight: bold; }
  .decision-ALLOW { color: #047857; font-weight: bold; }
  details.action-detail {
    border: 1px solid var(--tc-border);
    border-radius: 6px;
    margin: 1rem 0;
    padding: 0;
    background: var(--tc-bg);
  }
  details.action-detail > summary {
    cursor: pointer;
    padding: 0.75rem 1rem;
    background: var(--tc-card-bg);
    color: var(--tc-text);
    font-weight: 600;
  }
  .action-detail-body {
    padding: 0 1rem 1rem;
    color: var(--tc-text);
  }
  .tab-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
    margin: 1rem 0 0.5rem;
    border-bottom: 1px solid var(--tc-border);
    padding-bottom: 0.5rem;
  }
  .tab-btn {
    background: var(--tc-tab-inactive-bg);
    color: var(--tc-tab-inactive-text);
    border: 1px solid var(--tc-border);
    border-radius: 4px;
    padding: 0.35rem 0.65rem;
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .tab-btn.active {
    background: var(--tc-tab-active-bg);
    color: var(--tc-tab-active-text);
    border-color: var(--tc-tab-active-bg);
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  pre.raw-output {
    background: var(--tc-pre-bg);
    color: var(--tc-pre-text);
    border-radius: 4px;
    padding: 0.75rem;
    font-size: 0.85rem;
    overflow-x: auto;
    white-space: pre-wrap;
  }
  ul.reasons { margin: 0.5rem 0; padding-left: 1.25rem; }
  .unverified-note {
    color: var(--tc-warning-text);
    font-size: 0.9rem;
    margin: 0.5rem 0;
    font-weight: 600;
  }
</style>
</head>
<body class="truth-console-v0 high-contrast-light">
{{CONTENT}}
<script>
(function () {
  document.querySelectorAll(".action-detail").forEach(function (detail) {
    var buttons = detail.querySelectorAll(".tab-btn");
    var panels = detail.querySelectorAll(".tab-panel");
    buttons.forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        var target = btn.getAttribute("data-tab");
        buttons.forEach(function (b) { b.classList.remove("active"); });
        panels.forEach(function (p) { p.classList.remove("active"); });
        btn.classList.add("active");
        var panel = detail.querySelector('[data-panel="' + target + '"]');
        if (panel) panel.classList.add("active");
      });
    });
    if (buttons.length) buttons[0].click();
  });
})();
</script>
</body>
</html>
